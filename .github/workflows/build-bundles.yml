name: Build bundles

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Number of bundles (ios/android) to build in parallel per version
        default: '2'

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        run: echo "matrix=$(jq -c .versions scripts/rn-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    name: build (${{ matrix.rn.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        rn: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get yarn cache dir
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: yarn-${{ matrix.rn.id }}-${{ matrix.rn.version }}
          restore-keys: yarn-${{ matrix.rn.id }}-

      - name: Create project
        run: node scripts/create-projects.mjs --name "${{ matrix.rn.id }}" --version "${{ matrix.rn.version }}"

      - name: Build bundles
        run: node scripts/build-bundles.mjs --name "${{ matrix.rn.id }}" --version "${{ matrix.rn.version }}" --concurrency "${{ inputs.concurrency || '2' }}"

      - name: Upload metro stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metro-stats-${{ matrix.rn.id }}
          path: tmp/*/*-metro-stats.json
          if-no-files-found: warn

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Merge metro stats
        uses: actions/upload-artifact/merge@v7
        with:
          name: metro-stats
          pattern: metro-stats-*
          delete-merged: true
